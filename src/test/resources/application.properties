spring.application.name=account-service-test
spring.profiles.active=test
logging.level.org.springframework.security=WARN

app.secret=test-secret
app.base-url=http://localhost:8080

# PostgreSQL (Overridden by Testcontainers @ServiceConnection)
spring.datasource.url=jdbc:postgresql://localhost:5432/account
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT
app.jwt.secret=testing-secret-jwt-key-with-sufficient-length-for-hs512-signature-security-checking-12345

# OAuth
spring.security.oauth2.authorizationserver.client.google.client-id=dummy-google-client-id
spring.security.oauth2.authorizationserver.client.google.client-secret=dummy-google-client-secret

# Liquibase
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000

# Minio
minio.url=http://localhost:9000
minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=test-bucket

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# FrontEnd
app.frontend.url=http://localhost:5173
app.cors.allowedOrigins=http://localhost:5173

# OpenTelemetry Tracing
otel.service.name=account-service-test
otel.traces.exporter=none
otel.metrics.exporter=none
otel.logs.exporter=none
